name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (headless, no camera/display)
    runs-on: ${{ matrix.os }}
    # Use bash on every OS (incl. Windows) so multi-line `\` run steps parse
    # consistently; the default Windows shell (PowerShell) treats `\` differently.
    defaults:
      run:
        shell: bash
    env:
      # UI tests run fully headless via Qt's offscreen platform (no display, no camera).
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Linux Qt offscreen libraries (for the headless UI tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: "Install (locked): core + dev + UI, PySide6 for headless QML tests"
        run: |
          # Refresh build tooling too: the runner ships an old setuptools whose
          # deprecated package_index has known CVEs and would trip pip-audit.
          python -m pip install --upgrade pip setuptools wheel
          # AM-5: exact, hash-verified versions so two runs a month apart install
          # the same tree. The lock is universal (markers cover every OS in the
          # matrix and both Python versions); regenerate it with:
          #   uv pip compile --universal --generate-hashes --extra dev --extra ui \
          #     --python-version 3.11 pyproject.toml -o requirements-ci.txt
          # `--require-hashes` refuses anything unpinned, so the project itself is
          # installed separately with --no-deps (it is not on PyPI and has no hash).
          # The [ui] extra (PySide6) is needed for the offscreen UI tests; no camera
          # (vision) extra is installed here, so this job stays hardware-free.
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (core modules + pure overlay logic)
        run: mypy src/privacy_guard/config src/privacy_guard/geometry src/privacy_guard/tracking src/privacy_guard/policy src/privacy_guard/masking src/privacy_guard/overlay/renderer.py src/privacy_guard/overlay/grabber.py src/privacy_guard/overlay/compositor.py src/privacy_guard/capture/resilience.py src/privacy_guard/capture/downscale.py src/privacy_guard/capture/cadence.py src/privacy_guard/ui/autostart.py

      - name: Bandit (security lint)
        run: bandit -r src -ll

      # Note: with the lock in place, a CVE published against a pinned version
      # turns this job red until `requirements-ci.txt` is regenerated. That is the
      # point — it is a prompt to update, not noise to silence.
      - name: pip-audit (dependency CVEs)
        # Audits the CI venv (runtime + dev deps, all version-bounded) + build tooling.
        # --skip-editable skips THIS project (installed via `pip install -e .`): it
        # isn't on PyPI and can't be audited. We deliberately do NOT pass --strict:
        # --strict turns "a package couldn't be audited" (i.e. our own editable
        # package) into a hard failure. Without it, pip-audit still fails the build on
        # any real CVE in a third-party dependency, which is what we care about.
        run: pip-audit --desc --skip-editable

      - name: Tests (exclude slow/hardware), with coverage
        run: |
          pytest -m "not slow and not requires_hardware" \
            --cov=privacy_guard --cov-report=term-missing --cov-report=xml

      - name: Privacy guarantees (no network / no frame persistence)
        run: pytest -m privacy -v

      - name: "QML selfcheck (assembled wiring: engine + context + view-models)"
        # The unit tests instantiate each view against a fake context; this loads
        # them through the real shell entry point, which is what a frozen build
        # runs. It catches wiring regressions no view-model test can see.
        run: nexshieldveil --check

      - name: Performance benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -m performance -v

  real-adapters:
    name: Real adapters (vision extras, non-blocking)
    runs-on: ubuntu-latest
    # AM-17: the matrix above never installs [vision], so opencv_sources and
    # mediapipe_detector are imported by nothing — a regression in either would
    # surface only when someone runs the app by hand. This job loads them for
    # real. Non-blocking on purpose: it depends on heavy third-party wheels whose
    # availability we do not control, and it must inform rather than gate.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries (Qt offscreen + OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install with the vision extras
        # Deliberately unpinned: this job's value is telling us early when a new
        # OpenCV/MediaPipe release breaks the adapters. Pinning it would hide
        # exactly what it exists to find.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,vision,ui]"

      - name: Full suite with the real adapters loaded
        # No model file is fetched: MediaPipe inference stays out of CI (the app
        # never downloads a model, and neither should the pipeline that tests it).
        # What runs here is every test the vision extras un-skip — real video
        # decoding, real downscaling, the detector's degradation path.
        run: pytest -m "not slow and not requires_hardware" -q

      - name: Privacy guarantees with the real decoder in the loop
        run: pytest -m privacy -v
