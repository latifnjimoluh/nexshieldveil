# Privacy Guard — example configuration.
# Copy to e.g. config.toml and adjust. All values shown are the defaults.
# Every threshold is intentionally conservative; tune to your environment.

[camera]
enabled = true
device_index = 0       # which webcam to use
target_fps = 15
downscale_width = 640  # frames downscaled to this width before vision (speed)
# Idle back-off: once nobody has been in front of the camera for idle_after_ms,
# the loop drops to idle_fps to spare CPU/battery. A face restores the full rate
# immediately. Set idle_after_ms = 0 to always run at target_fps.
idle_fps = 5
idle_after_ms = 30000

[detection]
# Local path to the MediaPipe Face Landmarker model. No auto-download ever.
# Leave unset to run in degraded mode (no detection, never masks, no crash).
# model_path = "models/face_landmarker.task"
max_faces = 4
min_detection_confidence = 0.5

[geometry]
# How forgiving the "is this gaze pointing at my screen?" test is. Generous by
# default because webcam gaze estimation has ~1.5-3 degrees of error.
gaze_tolerance_deg = 18.0
screen_width_mm = 520.0
screen_height_mm = 290.0
camera_above_screen_mm = 10.0

[tracking]
# EMA smoothing: higher = more reactive, lower = smoother. (0, 1].
# This adds ~1-2 frames of warm-up to the effective masking delay (on top of
# policy.trigger_ms). Set to 1.0 to disable smoothing (most reactive).
smoothing_alpha = 0.4

[policy]
# Hysteresis (anti-flicker). release_ms must be >= trigger_ms.
trigger_ms = 400   # observer must look this long before masking engages
release_ms = 800   # observer must be gone this long before masking lifts
# Walk-away lock: mask after this long with NO face in front of the camera.
# 0 disables it (default). It reacts to absence, never to identity: any face
# coming back lifts the mask, not necessarily yours (see docs/LIMITATIONS.md).
absence_ms = 0

[primary_user]
# How the primary user is told apart from other faces (never identity).
centrality_weight = 1.0
size_weight = 1.0
# Temporal hysteresis on the election: whoever holds the title keeps it unless a
# challenger scores better by switch_margin for switch_patience frames in a row.
# Without it, two people at comparable distance swap the title on a micro-movement
# — and the title decides whose gaze is ignored.
switch_margin = 0.08
switch_patience = 3
match_distance = 0.15   # max normalised move for a face to be "the same" next frame

[masking]
# All three styles are live. "veil" never captures the screen; "pixelate"/"blur"
# transform ONE local capture taken at masking time (freeze-frame), kept in RAM
# only and released when the mask lifts. A failed capture falls back to the veil.
strategy = "veil"   # "veil" | "pixelate" | "blur"
opacity = 0.92      # veil opacity, [0, 1]
blur_radius = 21    # for strategy = "blur"
pixelate_blocks = 24  # for strategy = "pixelate" (fewer blocks = coarser)
